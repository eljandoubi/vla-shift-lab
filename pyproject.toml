[project]
name = "vla-shift-lab"
version = "0.1.0"
description = "Evaluation study: does a LIBERO-trained SmolVLA read its instruction, and how does it fail under shifts?"
readme = "README.md"
authors = [
    { name = "AbdelKarim ELJANDOUBI", email = "78537694+eljandoubi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
report = [
    "matplotlib>=3.8",
]

[project.scripts]
vlashift = "vlashift.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
addopts = "-m 'not needs_lerobot'"
testpaths = ["tests"]
markers = [
    "needs_lerobot: reads the source files of an installed LeRobot (no weights, no simulator)",
]

[tool.coverage.run]
source = ["vlashift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.uv.build-backend]
module-name = "vlashift"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
